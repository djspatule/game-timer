     	<!-- to clean if sucessfull (add to a dedicated CSS file or else) -->
     	<style type="text/css">
     		.button {
				border: none;
				color: #ffffff;
				padding: 10px 16px;
				position: relative;
				cursor: pointer;
				font-family: "Fira Sans", sans-serif;
				overflow: hidden;
				border-radius: 5px;
				min-width: 125px;
				/*added manually*/
				min-height: 200px;
			}

			.button__progress {
				position: absolute;
				height: 0%;
				width: 100%;
				top: 0;
				left: 0;
				background: rgba(0, 0, 0, 0.2);
				transition: width 0.3s;
			}

			.button__text {
				position: relative;
			}
     	</style>
		
		<title>
			Game Timer
		</title>
	</head>
	<body>
		<div class="text-center container">
			<h1>Gamer Timer</h1>
			<button class="btn btn-default"><a href="html/about.html" class="bi bi-info-circle"></a></button>
			<button class="btn btn-default bi bi-volume-mute-fill" style="background-color: grey" id="muteButton"></button>
			<button class="btn btn-default bi bi-moon-fill"; id="darkButton"></button>
			<br><br>
			<button class="btn btn-default" id="setTurnLengthButton">Set turn duration</button>
			<button class="btn btn-default" id="setNumberOfPlayersButton">Set number of players</button>
			<br><br>
			<div id="newPlayerNode"></div>
			<br><button class="btn btn-default" id="totalPlayTimeButton"><h3>Total play time:</h3><br>(click to reset) <br><br> <h2><div id="totalPlayTimeDisplayDiv"> 00:00:00 </div></h2></button>
		</div>
	<script src="script.js"></script>
	</body>
</html>
