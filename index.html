     	<!-- to clean if sucessfull (add to a dedicated CSS file or else) -->
     	<style type="text/css">
     		.progressButton {
				border: none;
				color: #ffffff;
				padding: 10px 16px;
				position: relative;
				cursor: pointer;
				font-family: "Fira Sans", sans-serif;
				overflow: hidden;
				border-radius: 5px;
				min-width: 125px;
				/*added manually*/
				min-height: 200px;
			}

			.progressButton__progress {
				position: absolute;
				height: 0%;
				width: 100%;
				top: 0;
				left: 0;
				background: rgba(0, 0, 0, 0.2);
				transition: width 0.3s;
			}

			.progressButton__text {
				position: relative;
			}

			.big {
			    display: block;
			    font-size: 1.17em;
			    margin-top: 1em;
			    margin-bottom: 0.5em;
			    margin-left: 0;
			    margin-right: 0;
			    font-weight: bold;
			}
     	</style>
		
		<title>
			TableTop-Timer
		</title>
	</head>
	<body>
		<div class="text-center container">
			<h1>TableTop-Timer <small class="test-muted"><a href="html/about.html" class="bi bi-info-circle"></a></small></h1>
			<button class="btn btn-outline-secondary bi bi-gear" type="button" data-toggle="collapse" data-target="#settingsDiv" aria-expanded="false" aria-controls="collapseExample" id="settingsButton"></button>
			<button class="btn btn-secondary bi bi-volume-mute-fill" id="muteButton"></button> <!-- style="background-color: blue" -->
			<button class="btn btn-outline-secondary bi bi-moon-fill" id="darkButton"></button>
			<!-- <div class="btn-group-vertical" role="group" aria-label="Basic radio toggle button group">
			  	<input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
			  	<label class="btn btn-outline-secondary bi bi-hourglass" for="btnradio1"></label>

		  		<input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
		 		<label class="btn btn-outline-secondary  bi bi-stopwatch-fill" for="btnradio2"></label>
			</div> -->
			<br>
			<div class="collapse" id="settingsDiv">
				<div class="card card-body col-6 offset-3">
					<!-- <a href="html/about.html" class="btn btn-outline-secondary bi bi-info-circle"> About</a> -->
					<br>
					<div class="dropdown">
						<button class="btn btn-outline-secondary dropdown-toggle" type="button" data-toggle="dropdown" id="playerSettingsButton" aria-haspopup="true" aria-expanded="false">
							Player settings
						</button>
						<form class="dropdown-menu p-4" id="dropDownForm" name="playerSettingsForm">
							<div id="dropDownFormGroup"></div>
							<button type="button" class="btn btn-primary" id="playersNamesSubmissionButton">Confirm</button>
						</form>
					</div>
					<br>
					<button class="btn btn-outline-secondary" id="setNumberOfPlayersButton">Number of players</button>
					<br>
					<button class="btn btn-outline-secondary" id="setTurnLengthButton">Turn duration</button>
				</div>
			</div>
			<br>
			<div id="newPlayerNode"></div>
			<br><button class="btn btn-secondary" id="totalPlayTimeButton"><h3>Total play time:</h3><br>(click to reset) <br><br> <h2><div id="totalPlayTimeDisplayDiv"> 00:00:00 </div></h2></button>

		</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-kQtW33rZJAHjgefvhyyzcGF3C5TFyBQBA13V1RKPf4uH+bwyzQxZ6CmMZHmNBEfJ" crossorigin="anonymous"></script>
