     	<!-- to clean if sucessfull (add to a dedicated CSS file or else) -->
     	<style type="text/css">
     		.progressButton {
				border: none;
				color: #ffffff;
				padding: 10px 16px;
				position: relative;
				cursor: pointer;
				font-family: "Fira Sans", sans-serif;
				overflow: hidden;
				border-radius: 5px;
				min-width: 125px;
				/*added manually*/
				min-height: 200px;
			}

			.progressButton__progress {
				position: absolute;
				height: 0%;
				width: 100%;
				top: 0;
				left: 0;
				background: rgba(0, 0, 0, 0.2);
				transition: width 0.3s;
			}

			.progressButton__text {
				position: relative;
			}
     	</style>
		
		<title>
			Game Timer
		</title>

			<button class="btn btn-light bi bi-volume-mute-fill" style="background-color: grey" id="muteButton"></button>
			<button class="btn btn-light bi bi-moon-fill" id="darkButton"></button>

			<br>
